server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # TLS, HSTS, and the redirect from :80 are Traefik's job. This server only
    # ever sees plaintext traffic on the internal network.
    server_tokens off;

    # `nuxt generate` prerenders each route into a directory (setup/, login/,
    # dashboard/), so nginx issues a 301 to append the trailing slash. By
    # default it builds that Location as an absolute URL from what it can see:
    # http://<host>:8080/setup/ — the container's own plaintext port, which no
    # client outside the Docker network can reach. Emitting a relative Location
    # lets the browser resolve it against the original https://host, which is
    # the only thing that works behind a terminating proxy.
    absolute_redirect off;
    port_in_redirect off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/manifest+json;

    # Keep the dashboard and API on one origin when the image is deployed
    # behind a platform proxy such as Dokploy. In the standalone Compose stack
    # Traefik handles /api before this request reaches nginx, so this fallback
    # does not change the existing deployment.
    location /api/ {
        proxy_pass http://server:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Request-ID $http_x_request_id;
    }

    # Nuxt fingerprints every file under /_nuxt/, so they can be cached forever.
    location /_nuxt/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    location = /favicon.ico {
        expires 7d;
        access_log off;
        try_files $uri =404;
    }

    # SPA fallback: client-side routes such as /dashboard/links have no file on
    # disk and must be served the app shell. index.html itself is never cached,
    # otherwise a deploy would leave browsers pinned to stale asset hashes.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    location = /health {
        access_log off;
        add_header Content-Type application/json;
        return 200 '{"status":"ok"}';
    }
}
